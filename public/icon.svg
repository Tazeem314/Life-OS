<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base background (full bleed for maskable) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner ambient card / glow within safe zone (80% = 410px) -->
  <rect x="76" y="76" width="360" height="360" rx="72" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" filter="url(#shadow)" />

  <!-- Streak Flame / Spark Icon in top right -->
  <circle cx="350" cy="162" r="28" fill="#f59e0b" fill-opacity="0.25" />
  <path d="M350 144c-2 8-8 12-8 19 0 7 5 13 12 13s12-6 12-13c0-4-2-8-5-11 0 4-3 7-6 7s-4-3-4-6c0-3 3-6 5-9z" fill="#f59e0b" />

  <!-- To-do / Habit list bars -->
  <!-- Bar 1 with checked circle -->
  <g transform="translate(126, 172)">
    <circle cx="20" cy="20" r="18" fill="#10b981" />
    <path d="M12 20l5 5 11-11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="54" y="12" width="130" height="16" rx="8" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- Bar 2 with checked circle -->
  <g transform="translate(126, 236)">
    <circle cx="20" cy="20" r="18" fill="#0ea5e9" />
    <path d="M12 20l5 5 11-11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="54" y="12" width="160" height="16" rx="8" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- Bar 3 with active/streak circle -->
  <g transform="translate(126, 300)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4" />
    <circle cx="20" cy="20" r="8" fill="#f59e0b" />
    <rect x="54" y="12" width="110" height="16" rx="8" fill="#ffffff" fill-opacity="0.65" />
  </g>
</svg>
